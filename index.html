<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1e1e22" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Factorio Blueprint Decoder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="locale-switch">
      <span data-locale="en">EN</span>
      <span class="sep">·</span>
      <span data-locale="ru">RU</span>
    </div>
    <h1>Factorio Blueprint Decoder</h1>
    <p class="subtitle">Paste a blueprint string — get the JSON.</p>
  </header>

  <main id="app" class="content">
    <!-- populated by src/app.js -->
  </main>

  <footer class="site-footer">
    <p>
      <span class="footer-note">Runs locally in your browser. The string is never sent anywhere.</span>
      <span class="sep">·</span>
      <a href="https://github.com/kaferi/factorio-bp" target="_blank" rel="noopener noreferrer">GitHub</a>
    </p>
  </footer>

  <script src="vendor/pako.min.js"></script>
  <script type="module" src="src/app.js"></script>
</body>
</html>
